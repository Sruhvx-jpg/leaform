name: "CodeQL Analysis"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "etc/**"
      - ".agents/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "*.md"
      - "etc/**"
      - ".agents/**"
      - ".gitignore"
      - "LICENSE"
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger via API or Telegram bot

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Notify Telegram on Start
        run: |
          curl --fail -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=🚀 CodeQL Analysis started for ${{ github.repository }} (Trigger: ${{ github.event_name }}, Branch: ${{ github.ref_name }})."

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Notify Telegram on Success
        if: success()
        run: |
          curl --fail -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ CodeQL Analysis completed successfully for ${{ github.repository }} (Trigger: ${{ github.event_name }}, Branch: ${{ github.ref_name }})."

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          curl --fail -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ CodeQL Analysis failed for ${{ github.repository }} (Trigger: ${{ github.event_name }}, Branch: ${{ github.ref_name }}). Details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
